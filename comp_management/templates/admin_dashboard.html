<!DOCTYPE html>
<html>
    <head>
     <title>Home</title>
     <style>
            .flash-message {
                display: inline-block;
                padding: 12px 16px;
                margin-bottom: 20px;
                border-radius: 12px;
                font-size: 14px;
                vertical-align: center;
                
            }

            .flash-message.success {
                background-color: #e8f7e8;
                color: #237a23;
                border: 1px solid #a8d8a8;
            }

            .flash-message.danger {
                background-color: #fdeaea;
                color: #b42323;
                border: 1px solid #f0aaaa;
            }
            .complaint-container{
                border-color: #40b9ff;
                border: solid;
                margin: 10px;
                padding: 10px;
                width:300px;
            }

     </style>
    </head>
    <body>
            {% with messages=get_flashed_messages(with_categories=true)%}
              {%if messages%}
                    {%for category,message in messages%}
                        <div class="flash-message {{category}}">
                            {{message}}
                        </div>
                    {%endfor%}
              {%endif%}
           {%endwith%}
            <a href="{{ url_for('account')}}">
                Account
            </a>
            <a href="{{ url_for('logout') }}">Log out</a> 
           <P><a href="{{url_for('all_complaints')}}">Complaints</a></P>
           <p><a href="{{url_for('categories')}}">Categories</a></p>
           <p><a href="{{url_for('all_users')}}">Users</a></p>
           
    </body>
</html>
